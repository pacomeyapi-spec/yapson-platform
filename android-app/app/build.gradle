plugins {
    id 'com.android.application'
}

android {
    namespace 'net.yapson.platform'
    compileSdk 34

    defaultConfig {
        applicationId "net.yapson.platform"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Pas de dépendances externes — WebView est intégré à Android
dependencies {}
