plugins {
    id 'com.android.application'
}

android {
    namespace 'net.yapson.platform'
    compileSdk 34

    defaultConfig {
        applicationId "net.yapson.platform"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "yapson.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias "yapson"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
