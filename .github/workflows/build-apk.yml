name: Build Yapson APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/build-apk.yml'
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Download Gradle 8.4 wrapper
        working-directory: android-app
        run: |
          # Télécharger le JAR du wrapper Gradle 8.4
          curl -sL \
            "https://services.gradle.org/distributions/gradle-8.4-bin.zip" \
            -o /tmp/gradle-8.4.zip
          unzip -q /tmp/gradle-8.4.zip -d /tmp/gradle-dist
          GRADLE_BIN=/tmp/gradle-dist/gradle-8.4/bin/gradle
          chmod +x $GRADLE_BIN
          $GRADLE_BIN wrapper --gradle-version=8.4
          echo "Gradle version:"
          ./gradlew --version

      - name: Generate keystore
        working-directory: android-app
        run: |
          keytool -genkeypair -v \
            -keystore yapson.keystore \
            -alias yapson \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Yapson, O=Yapson, C=CI"

      - name: Build APK
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=yapson.keystore \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias=yapson \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
            --no-daemon --info 2>&1 | tail -50

      - name: List output files
        run: find android-app -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yapson-apk-v${{ github.run_number }}
          path: "android-app/app/build/outputs/apk/release/*.apk"
          if-no-files-found: warn
          retention-days: 90
