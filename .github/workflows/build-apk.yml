name: Build Yapson APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/build-apk.yml'
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools & platform
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" --sdk_root=$ANDROID_SDK_ROOT

      - name: Generate keystore
        working-directory: android-app
        run: |
          keytool -genkeypair -v \
            -keystore yapson.keystore \
            -alias yapson \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Yapson, O=Yapson, C=CI"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        working-directory: android-app
        env:
          KEYSTORE_PATH: yapson.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        working-directory: android-app
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks yapson.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias yapson \
            --out app-release-signed.apk \
            "$APK"
          ls -la app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yapson-platform-v${{ github.run_number }}
          path: android-app/app-release-signed.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Yapson Platform APK v${{ github.run_number }}"
          body: "APK Android - Yapson Platform Mobile Money"
          files: android-app/app-release-signed.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
