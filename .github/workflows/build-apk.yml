name: Build Yapson APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore yapson.keystore \
            -alias yapson \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Yapson, OU=Mobile, O=Yapson, L=Abidjan, ST=Abidjan, C=CI"

      - name: Initialize & Build TWA project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p twa && cd twa

          # Répondre "No" automatiquement à la question JDK, utiliser Java déjà installé
          echo "No" | bubblewrap init \
            --manifest="https://yapson-platform-production.up.railway.app/manifest.json"

      - name: Configure signing & Build APK
        working-directory: twa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Mettre à jour la config de signature dans twa-manifest.json
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json'));
            m.signingKey = { path: '../yapson.keystore', alias: 'yapson' };
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=../yapson.keystore \
            --signingKeyAlias=yapson

      - name: Find APK files
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yapson-apk-v${{ github.run_number }}
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 90
