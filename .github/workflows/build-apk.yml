name: Build Yapson APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore yapson.keystore \
            -alias yapson \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yapson2026 \
            -keypass yapson2026 \
            -dname "CN=Yapson, OU=Mobile, O=Yapson, L=Abidjan, ST=CI, C=CI"

      - name: Initialize TWA project
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: '1'
        run: |
          bubblewrap init \
            --manifest https://yapson-platform-production.up.railway.app/manifest.json \
            --skipPwaValidation

      - name: Configure signing
        run: |
          # Mettre à jour twa-manifest.json avec le keystore
          node -e "
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
          m.signingKey = { path: '../yapson.keystore', alias: 'yapson' };
          fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          console.log('Signing configured');
          "

      - name: Build APK
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: '1'
        run: |
          bubblewrap build \
            --skipPwaValidation
        timeout-minutes: 20

      - name: List generated files
        run: find . -name "*.apk" 2>/dev/null | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yapson-platform-apk-v${{ github.run_number }}
          path: "*.apk"
          if-no-files-found: error
          retention-days: 60
