name: Build Yapson APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/build-apk.yml'
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Download Gradle 8.4 wrapper
        working-directory: android-app
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle-8.4.zip
          unzip -q /tmp/gradle-8.4.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.4/bin/gradle wrapper --gradle-version=8.4
          ./gradlew --version

      - name: Generate keystore (same password for store and key)
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore yapson.keystore \
            -alias yapson \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${KEYSTORE_PASSWORD}" \
            -keypass "${KEYSTORE_PASSWORD}" \
            -dname "CN=Yapson, O=Yapson, C=CI"

      - name: Build APK (debug)
        working-directory: android-app
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -10
          find app/build/outputs -name "*.apk"

      - name: Sign APK with jarsigner
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Signing: $APK"
          jarsigner -verbose \
            -keystore yapson.keystore \
            -storepass "${KEYSTORE_PASSWORD}" \
            -keypass "${KEYSTORE_PASSWORD}" \
            -signedjar app-release-signed.apk \
            "$APK" yapson
          echo "Result:"
          ls -lh app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yapson-apk-v${{ github.run_number }}
          path: android-app/app-release-signed.apk
          if-no-files-found: error
          retention-days: 90
